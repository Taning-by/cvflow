[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvflow"
version = "0.1.0"
description = "Open, flow-based industrial machine vision platform with pluggable Python algorithm nodes and PLC communication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tanxinji" }]
keywords = ["machine-vision", "industrial", "opencv", "plc", "modbus", "node-editor", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PySide6-Essentials>=6.5",
    "pymodbus>=3.6",
    "pyserial>=3.5",
    "onnxruntime>=1.16",
]

[project.urls]
Homepage = "https://github.com/Taning-by/cvflow"
Issues = "https://github.com/Taning-by/cvflow/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "onnx>=1.14"]
gpu = ["onnxruntime-gpu>=1.16"]
genicam = ["harvesters>=1.4"]
plc = ["python-snap7>=1.3"]
dl = ["torch", "torchvision"]

[project.scripts]
cvflow = "cvflow.cli:main"

[project.gui-scripts]
cvflow-gui = "cvflow.ui:main"

[tool.setuptools.packages.find]
include = ["cvflow*"]

[tool.setuptools.package-data]
"cvflow.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
