[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvflow"
version = "0.1.0"
description = "Open, flow-based industrial machine vision platform with pluggable Python algorithm nodes and PLC communication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tanxinji" }]
keywords = ["machine-vision", "industrial", "opencv", "plc", "modbus", "node-editor", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PySide6-Essentials>=6.5",
    "pymodbus>=3.6",
    "pyserial>=3.5",
]
# 注意：onnxruntime 故意不放在基础依赖里。CPU 版 onnxruntime 与 GPU 版 onnxruntime-gpu
# 装的是同一个 Python 模块，同时存在会互相覆盖（典型症状：装了 GPU 版却只有 CPU 后端），
# 所以把它们拆成两个互斥的 extra，由使用者二选一。

[project.urls]
Homepage = "https://github.com/Taning-by/cvflow"
Issues = "https://github.com/Taning-by/cvflow/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "onnx>=1.14"]
cpu = ["onnxruntime>=1.16"]            # 与 gpu 互斥，二选一
# onnxruntime-gpu 自带的 cuda / cudnn extra 会把 CUDA、cuDNN 的 pip 包一并装上，
# 配合运行时的 preload_dlls()，不需要系统装 CUDA，也不用配 LD_LIBRARY_PATH / PATH。
#
# 版本范围两头都是必须的：
#   下限 1.21：cuda / cudnn 这两个 extra 和 preload_dlls() 都是 1.21.0 才有的，装到 1.19 / 1.20
#              会出现"包里有 CUDA 后端但一个运行库都没装"，而且 pip 只给一句警告。
#   上限 1.27：1.27 起 onnxruntime-gpu 换成了 CUDA 13，要求驱动 >= 580，而且只支持算力 7.5 以上
#              （Turing / RTX 20 系往后）——Pascal 的 GTX 10 系、Quadro P 系这些产线上还在用的卡直接
#              用不了。卡在 CUDA 12 这条线上，驱动 >= 527.41 就能跑，老卡新卡都覆盖。
# 新机器想用 CUDA 13 版，装 gpu-cuda13（驱动 >= 580，算力 >= 7.5）。
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27"]
gpu-cuda13 = ["onnxruntime-gpu[cuda,cudnn]>=1.27"]
genicam = ["harvesters>=1.4"]
plc = ["python-snap7>=1.3"]
dl = ["torch", "torchvision"]

[project.scripts]
cvflow = "cvflow.cli:main"

[project.gui-scripts]
cvflow-gui = "cvflow.ui:main"

[tool.setuptools.packages.find]
include = ["cvflow*"]

[tool.setuptools.package-data]
"cvflow.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
