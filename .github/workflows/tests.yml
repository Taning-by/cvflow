name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - name: Install
        run: pip install -e ".[dev,cpu]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # 一键安装脚本本身也要测：装环境是用户的第一道门，脚本坏了后面全都无从开始。
  # 这里跑 CPU 路径（CI 没有显卡），脚本里除了驱动检查和 .[gpu] 那一行，其余步骤与 GPU 路径完全相同。
  install-script:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - name: 用 Windows PowerShell 5.1 解析两个脚本（Windows）
        if: runner.os == 'Windows'
        # 关键：用 powershell.exe（5.1）而不是 pwsh（7.x）。产线和开发机上的默认
        # PowerShell 往往还是 5.1，PS7 专有语法在 5.1 上是**解析期**错误——脚本一行都不执行，
        # 而用 pwsh 跑完全看不出来（build.ps1 里的 ?. 就是这么漏过去的）。
        shell: powershell
        run: |
          foreach ($f in @("install.ps1", "packaging\build.ps1")) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host "${f}: $($_.Message)" }; exit 1 }
            Write-Host "$f parsed OK on PowerShell $($PSVersionTable.PSVersion)"
          }
      - name: 跑一遍 install.ps1 -Cpu（Windows，用 5.1 执行）
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -Cpu
      - name: 跑一遍 install.sh --cpu（Linux）
        if: runner.os == 'Linux'
        run: bash -n install.sh && ./install.sh --cpu
      # 项目自带 Python 这条路也要测：下载 + 校验 SHA256 + 用它重建环境
      - name: 便携版 Python（-BootstrapPython / --bootstrap-python）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -Command ".\install.ps1 -BootstrapPython -Recreate -Cpu"
            PY=.venv/Scripts/python.exe
          else
            ./install.sh --bootstrap-python --recreate --cpu
            PY=.venv/bin/python
          fi
          # venv 必须绑在项目里的 .python 上，不能是 runner 自带的那个 Python
          "$PY" -c "import sys,os;b=os.path.realpath(sys.base_prefix);p=os.path.realpath('.python');print(b);assert b==p, f'{b} != {p}'"
          "$PY" -c "import sys;assert sys.version_info[:2]==(3,12), sys.version"
      - name: 脚本建出来的环境能跑测试
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m cvflow gpu
          "$PY" -m pytest -q

  # 安装包的构建链路也要有人盯着：本机没有 Windows，CI 是唯一能持续验证它的地方。
  # 走 -SkipGpu（不收 1.6 GB 的 CUDA/cuDNN），验证的是 PyInstaller 配置 + Inno Setup 脚本
  # 这条链路本身；GPU 组件的切分靠 build.ps1 打印的组件体积来核对。
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装环境（CPU 版就够，GPU 组件这一轮不收）
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,cpu]"
          pip install "pyinstaller>=6.6"
      - name: 装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 打包（用 Windows PowerShell 5.1 执行，和用户机器一致）
        shell: powershell
        run: .\packaging\build.ps1 -SkipGpu -Version 0.0.0-ci
      - name: 冻结出来的程序能跑
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          .\dist\CVFlow\cvflow.exe nodes | Select-Object -First 3
          .\dist\CVFlow\cvflow.exe gpu
          if (-not (Test-Path .\dist\CVFlow\CVFlow.exe)) { throw "没产出界面程序" }
      - name: 产出了安装程序
        shell: pwsh
        run: |
          $setup = Get-ChildItem .\dist\CVFlow-Setup-*.exe
          if (-not $setup) { throw "没产出安装程序" }
          Write-Host "安装程序 $($setup.Name) $([math]::Round($setup.Length/1MB)) MB"
      - uses: actions/upload-artifact@v4
        with:
          name: CVFlow-Setup-cpu-only
          path: dist/CVFlow-Setup-*.exe
          retention-days: 14
